# Blueprint de Render: crea la web y la base de datos PostgreSQL.
# En Render: New > Blueprint > elige este repositorio.
services:
  - type: web
    name: aipex-digital
    runtime: node
    plan: free # cambia a "starter" para que la publicación programada y los DMs funcionen sin pausas
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: aipex-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: INSTAGRAM_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: APP_NAME
        value: AIPEX DIGITAL
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false

databases:
  - name: aipex-db
    plan: free # la base de datos gratuita de Render caduca a los 30 días: pásala a "basic-256mb" para uso real
    region: frankfurt
    databaseName: aipex
